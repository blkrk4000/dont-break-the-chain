name: Lockfile erzeugen und Build prüfen

# Manuell starten: Actions → "Lockfile erzeugen und Build prüfen" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lockfile erzeugen
        run: npm install --package-lock-only

      - name: Sauber installieren und bauen
        run: |
          npm ci
          npm run build
          test -f dist/sw.js && test -f dist/manifest.json && test -f dist/favicon.svg

      - name: Lockfile committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: package-lock.json hinzugefügt"
          git push
